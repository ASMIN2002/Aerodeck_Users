<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEEPIT — Offline</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050810;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 12px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            margin: 0 0 24px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div>
        <h1>No Internet Connection</h1>
        <p>Please check your network and try again.</p>
        <button onclick="window.location.reload()">Retry Now</button>
    </div>
</body>

</html>
